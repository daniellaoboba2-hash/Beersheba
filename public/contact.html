<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Beersheba</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/extra.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="logo" onclick="location.href='/'" style="cursor:pointer;">👑&nbsp;BEERSHEBA<small>Stories that stay with you.</small></div>
    <div class="nav-right"><button class="btn btn-ghost btn-sm" onclick="location.href='/'">Back to Beersheba</button></div>
  </div>
</header>
<div class="policy-shell" style="max-width:520px;">
  <h1>Contact Us</h1>
  <div class="policy-updated">We read every message. Typical response within 1-2 business days.</div>
  <div id="successBox" style="display:none;" class="policy-content">
    <p>Thanks — your message has been sent to our team.</p>
    <button class="btn btn-ghost btn-sm" onclick="location.href='/'">Back to Beersheba</button>
  </div>
  <form id="contactForm" class="contact-form">
    <div class="auth-error" id="err"></div>
    <div class="field"><label>Name</label><input id="cName" required></div>
    <div class="field"><label>Email</label><input type="email" id="cEmail" required></div>
    <div class="field"><label>Topic</label>
      <select id="cTopic">
        <option>Account</option><option>Payment</option><option>Reading / Library</option>
        <option>VIP</option><option>PDF Download</option><option>Technical Issue</option><option>Other</option>
      </select>
    </div>
    <div class="field"><label>Message</label><textarea id="cMessage" rows="5" required></textarea></div>
    <button class="btn btn-gold btn-block" type="submit">Send Message</button>
  </form>
  <p class="small-muted" style="margin-top:16px;">Or email us directly at <b>support@beersheba.app</b>.</p>
</div>
<footer><div class="wrap footer-inner">
  <div class="logo" style="font-size:16px;">👑 BEERSHEBA</div>
  <div class="footer-links"><span onclick="location.href='/support.html'">Support</span><span onclick="location.href='/terms.html'">Terms</span><span onclick="location.href='/privacy.html'">Privacy</span></div>
  <div style="font-size:12px; color:var(--text-faint);">© 2026 Beersheba. All stories fictional.</div>
</div></footer>
<script src="/js/api.js"></script>
<script>
document.getElementById('contactForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('err');
  errBox.classList.remove('show');
  try {
    await API.post('/api/support/contact', {
      name: document.getElementById('cName').value.trim(),
      email: document.getElementById('cEmail').value.trim(),
      topic: document.getElementById('cTopic').value,
      message: document.getElementById('cMessage').value.trim(),
    });
    document.getElementById('contactForm').style.display = 'none';
    document.getElementById('successBox').style.display = 'block';
  } catch (err) {
    errBox.textContent = err.message;
    errBox.classList.add('show');
  }
});
</script>
</body>
</html>
