<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Beersheba</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/extra.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="logo">👑&nbsp;BEERSHEBA</div>
    <p class="auth-sub">Create your free account to continue.</p>
    <div class="auth-error" id="err"></div>
    <form id="registerForm">
      <div class="field"><label>Name</label><input type="text" id="name" required autocomplete="name"></div>
      <div class="field"><label>Email</label><input type="email" id="email" required autocomplete="email"></div>
      <div class="field"><label>Password</label><input type="password" id="password" required minlength="8" autocomplete="new-password"></div>
      <div class="field"><label>Confirm Password</label><input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password"></div>
      <label style="display:flex; align-items:flex-start; gap:8px; font-size:12.5px; color:var(--text-dim); margin-bottom:18px;">
        <input type="checkbox" id="agreeTerms" required style="margin-top:3px;">
        <span>I agree to the <a onclick="location.href='/terms.html'" style="color:var(--gold-bright); cursor:pointer;">Terms of Service</a> and <a onclick="location.href='/privacy.html'" style="color:var(--gold-bright); cursor:pointer;">Privacy Policy</a>.</span>
      </label>
      <button class="btn btn-gold btn-block" type="submit">Create Account</button>
    </form>
    <div class="auth-divider">or</div>
    <a class="btn-google" href="/api/auth/google/start?mode=SIGNUP">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3 16.3 3 9.7 7.4 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 36.1 26.9 37 24 37c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.6 40.6 16.3 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.6C41.8 36 45 30.5 45 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
      Continue with Google
    </a>
    <div class="auth-foot">Already have an account? <a onclick="location.href='/login.html'+location.search">Sign in</a></div>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/password-toggle.js"></script>
<script>
wirePasswordToggle('password');
wirePasswordToggle('confirmPassword');
(function(){
  const err = new URLSearchParams(location.search).get('error');
  if (err === 'google_email_exists_use_password') {
    const errBox = document.getElementById('err');
    errBox.textContent = 'An account already exists with that email. Sign in with your password, then connect Google from Account Settings.';
    errBox.classList.add('show');
  } else if (err) {
    const errBox = document.getElementById('err');
    errBox.textContent = 'Google sign-up could not be completed. Please try again.';
    errBox.classList.add('show');
  }
})();
document.getElementById('registerForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const errBox = document.getElementById('err');
  errBox.classList.remove('show');
  if (document.getElementById('password').value !== document.getElementById('confirmPassword').value) {
    errBox.textContent = 'Passwords do not match.';
    errBox.classList.add('show');
    return;
  }
  if (!document.getElementById('agreeTerms').checked) {
    errBox.textContent = 'Please agree to the Terms of Service and Privacy Policy to continue.';
    errBox.classList.add('show');
    return;
  }
  try {
    await API.post('/api/auth/register', {
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
    });
    const params = new URLSearchParams(location.search);
    location.href = params.get('next') || '/';
  } catch (err) {
    errBox.textContent = err.message;
    errBox.classList.add('show');
  }
});
</script>
</body>
</html>
