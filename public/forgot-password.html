<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Beersheba</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/extra.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="logo">👑&nbsp;BEERSHEBA</div>
    <p class="auth-sub">Enter your email and we'll send you a reset link.</p>
    <div class="auth-error" id="err"></div>
    <div id="successBox" style="display:none; text-align:center;">
      <p style="font-size:13.5px; color:var(--text-dim); margin-bottom:14px;">If an account exists for that email, a reset link has been sent.</p>
      <div id="devLinkBox" style="display:none;">
        <span class="dev-badge">DEV MODE — no email server configured</span>
        <p class="small-muted" style="margin:10px 0;">Since this environment can't send real email, here's the link directly:</p>
        <a id="devLink" href="#" class="btn btn-ghost btn-block"></a>
      </div>
    </div>
    <form id="forgotForm">
      <div class="field"><label>Email</label><input type="email" id="email" required autocomplete="email"></div>
      <button class="btn btn-gold btn-block" type="submit">Send Reset Link</button>
    </form>
    <div class="auth-foot"><a onclick="location.href='/login.html'">Back to sign in</a></div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const errBox = document.getElementById('err');
  errBox.classList.remove('show');
  try {
    const res = await API.post('/api/auth/forgot-password', { email: document.getElementById('email').value.trim() });
    document.getElementById('forgotForm').style.display = 'none';
    document.getElementById('successBox').style.display = 'block';
    if (res.resetUrl) {
      document.getElementById('devLinkBox').style.display = 'block';
      document.getElementById('devLink').href = res.resetUrl;
      document.getElementById('devLink').textContent = 'Open reset link';
    }
  } catch (err) {
    errBox.textContent = err.message;
    errBox.classList.add('show');
  }
});
</script>
</body>
</html>
