<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Beersheba</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/extra.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="logo">👑&nbsp;BEERSHEBA</div>
    <p class="auth-sub">Choose a new password.</p>
    <div class="auth-error" id="err"></div>
    <form id="resetForm">
      <div class="field"><label>New Password</label><input type="password" id="password" required minlength="8" autocomplete="new-password"></div>
      <button class="btn btn-gold btn-block" type="submit">Reset Password</button>
    </form>
    <div class="auth-foot"><a onclick="location.href='/login.html'">Back to sign in</a></div>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/password-toggle.js"></script>
<script>
wirePasswordToggle('password');
const token = new URLSearchParams(location.search).get('token');
document.getElementById('resetForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const errBox = document.getElementById('err');
  errBox.classList.remove('show');
  if (!token) { errBox.textContent = 'Missing reset token.'; errBox.classList.add('show'); return; }
  try {
    await API.post('/api/auth/reset-password', { token, password: document.getElementById('password').value });
    location.href = '/login.html';
  } catch (err) {
    errBox.textContent = err.message;
    errBox.classList.add('show');
  }
});
</script>
</body>
</html>
