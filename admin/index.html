<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beersheba Admin</title>
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="admin-shell">
  <button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="Open menu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="admin-sidebar-scrim" id="sidebarScrim" onclick="toggleSidebar(false)"></div>
  <aside class="admin-sidebar" id="sidebar">
    <div class="admin-logo">👑 BEERSHEBA<small>Publishing CMS</small></div>
    <nav class="admin-nav" id="adminNav">
      <a onclick="nav('dashboard')" data-nav="dashboard">Dashboard</a>
      <div class="section-label">Catalogue</div>
      <a onclick="nav('books')" data-nav="books">Books</a>
      <a onclick="nav('media')" data-nav="media">Media Library</a>
      <div class="section-label">Commerce</div>
      <a onclick="nav('readers')" data-nav="readers">Readers</a>
      <a onclick="nav('orders')" data-nav="orders">Orders</a>
      <a onclick="nav('entitlements')" data-nav="entitlements">Entitlements</a>
      <a onclick="nav('vip')" data-nav="vip">VIP Members</a>
      <div class="section-label">Community</div>
      <a onclick="nav('comments')" data-nav="comments">Comments</a>
      <a onclick="nav('reports')" data-nav="reports">Reports</a>
      <a onclick="nav('translations')" data-nav="translations">Translations</a>
      <div class="section-label">Platform</div>
      <a onclick="nav('analytics')" data-nav="analytics">Analytics</a>
      <a onclick="nav('settings')" data-nav="settings">Settings</a>
      <a onclick="nav('audit')" data-nav="audit">Audit Log</a>
      <div class="section-label"> </div>
      <a onclick="logoutAdmin()">Sign Out</a>
    </nav>
  </aside>
  <main class="admin-main" id="main">Loading…</main>
</div>
<div class="modal-scrim" id="modalScrim"><div class="modal-box" id="modalBox"></div></div>
<script src="/js/api.js"></script>
<script src="/admin/js/admin.js"></script>
</body>
</html>
